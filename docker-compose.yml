services:
  nba-backend:
    build: .
    image: nba-backend:latest
    container_name: nba-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      PORT: 3004
      NBA_DB_PATH: /data/nba.sqlite
      # WAJIB diganti di produksi:
      SESSION_SECRET: ganti-session-secret-ini
      ADMIN_PASSWORD: ganti-password-admin-ini
    volumes:
      - nba-data:/data

volumes:
  nba-data:
